[package]
name = "partial-stateless"
version = "0.1.0"
edition = "2024"
description = "Network-level state cache for Partial Statelessness PoC"

[dependencies]
# reth types (reuse existing structures)
alloy-consensus.workspace = true
alloy-primitives = { workspace = true, features = ["std", "map-foldhash", "serde"] }
alloy-rlp = { workspace = true }
revm-database = { workspace = true, features = ["std"] }
revm-state = { workspace = true, features = ["std"] }
revm-primitives = { workspace = true, features = ["std"] }
reth-execution-access = { workspace = true }
reth-primitives-traits = { workspace = true }
reth-trie-common = { workspace = true }
# `std` is not a portability knob here: it is the sparse trie's parallelism switch. Without it
# `is_reveal_parallelism_enabled` and `is_update_parallelism_enabled` are compiled to `false`, so
# proof reveal and subtrie hash updates run serially no matter how many cores the host has. The
# workspace declares this dependency `default-features = false`, and the standalone binaries link
# none of the node graph that would otherwise turn it on — so a package that does not ask for it
# here measures a trie production does not run. Same defect class as the keccak features below.
reth-trie-sparse = { workspace = true, features = ["std"] }

# serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bincode = { workspace = true }

# utilities
#
# `eyre` is here for `transition_build`, which is the one module in this crate whose errors are
# handed straight to a human running a build: every variant is a distinct construction-site
# failure with no caller that discriminates on it, so a typed enum would be a name per string and
# nothing else. Every consumer of this crate already links `eyre`.
eyre.workspace = true
thiserror.workspace = true
tracing = { workspace = true }

[features]
# Not default, because this crate is a library and its consumers decide the build profile:
# `partial-stateless-exex` turns both on by default to match `bin/reth`.
#
# They exist here so `cargo test -p partial-stateless` can profile the cache root on the keccak
# implementation production actually runs. Building this package alone selects only its own
# dependency graph, so without these the profile measures a keccak the node never uses — the
# defect that invalidated every absolute benchmark number before 2026-08-06.
asm-keccak = ["alloy-primitives/asm-keccak"]
keccak-cache-global = ["alloy-primitives/keccak-cache-global"]
# Gates the representation probe binary, which compares against the arena trie that
# `reth-trie-sparse/std` exposes. The feature is now on unconditionally above — the claim this
# comment used to make, that "the library itself never needs it", was wrong and cost the
# standalone binaries their trie parallelism.
repr-probe = ["reth-trie-sparse/std"]

[[bin]]
name = "trie_repr_probe"
required-features = ["repr-probe"]

[dev-dependencies]
# `test-utils` for `TrieTestHarness`, which is the only way to build an account trie a test can
# apply real leaf changes to — the cache-level undo differential needs one.
reth-trie = { workspace = true, features = ["test-utils"] }
serde_json = { workspace = true }
