[package]
name = "partial-stateless-replay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Database-free replay driver for recorded partial-stateless validation streams"

[lib]
name = "partial_stateless_replay"
path = "src/lib.rs"

[[bin]]
name = "ps-replay"
path = "src/main.rs"

[features]
# Same reason as `partial-stateless-validator`, and this is the package where it finally bites:
# this binary is built on its own, so nothing else's feature selection reaches it.
# `check_validator_isolation.sh` runs against this package and fails the build profile if these
# stop arriving.
default = ["asm-keccak", "keccak-cache-global"]

asm-keccak = ["alloy-primitives/asm-keccak", "revm/asm-keccak"]
keccak-cache-global = ["alloy-primitives/keccak-cache-global"]

# Global allocator selection, off by default so the default build stays the platform allocator
# and a build that names no allocator is unambiguous rather than silently jemalloc.
#
# This binary is the standalone validator, and its hot path allocates and frees sparse-trie node
# maps by the thousand per block. That makes the allocator a measurable input to every timing this
# package produces, not a packaging detail: the producer links jemalloc through the node graph
# while this binary linked the platform allocator, so the two processes were never running the
# same allocator even in the same run. These features exist to make that an arm rather than an
# accident. Whichever is selected is recorded in the run manifest.
#
# jemalloc wins if both are named, matching `reth-cli-util`'s precedence so a build here cannot
# mean something different from a build there. The override feature is part of that match and not
# optional: without it only Rust's `#[global_allocator]` path reaches jemalloc, while C and FFI
# allocations keep going to the platform allocator — which would make this arm a *different*
# allocator profile from the producer's rather than the same one.
jemalloc = [
    "dep:tikv-jemallocator",
    "dep:tikv-jemalloc-sys",
    "tikv-jemallocator?/override_allocator_on_supported_platforms",
]
snmalloc = ["dep:snmalloc-rs"]

[dependencies]
partial-stateless = { path = "../partial-stateless" }
partial-stateless-stream = { path = "../partial-stateless-stream" }
partial-stateless-validator = { path = "../partial-stateless-validator" }

# Implementation crates only where they carry no state database. The forbidden set is the
# validator's, enforced against this package by `check_validator_isolation.sh`.
reth-chainspec = { workspace = true, features = ["std"] }
reth-consensus = { workspace = true, features = ["std"] }
reth-ethereum-consensus = { workspace = true, features = ["std"] }
reth-ethereum-primitives = { workspace = true, features = ["std"] }
reth-evm-ethereum = { workspace = true, features = ["std"] }
reth-primitives-traits = { workspace = true, features = ["std", "secp256k1", "rayon"] }
revm = { workspace = true }

alloy-consensus.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-rpc-types-engine = { workspace = true, features = ["serde"] }

bincode.workspace = true
eyre.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["std"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

# Allocator backends. Leaf crates with no reth graph of their own, which is why selecting one
# cannot reach the implementation crates `check_validator_isolation.sh` forbids.
tikv-jemallocator = { workspace = true, optional = true }
tikv-jemalloc-sys = { workspace = true, optional = true }
snmalloc-rs = { workspace = true, optional = true }

[dev-dependencies]
reth-chainspec = { workspace = true, features = ["std"] }
# The follow tests build a real restorable snapshot fixture: a one-account state proved with the
# same trie machinery the producer's export uses. Dev-only, so the isolation-checked normal graph
# is untouched.
reth-trie = { workspace = true }
reth-trie-common = { workspace = true }
