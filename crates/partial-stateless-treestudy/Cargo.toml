[package]
name = "partial-stateless-treestudy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Offline comparison of cache-complement witness cost across state commitment schemes"

[lints]
workspace = true

# Features are re-declared here rather than inherited. Cargo unifies features per package, so a
# study binary built as `-p partial-stateless-treestudy` would otherwise hash with a different
# keccak implementation than the node whose measured numbers this crate is calibrated against.
[features]
default = ["asm-keccak", "keccak-cache-global"]
asm-keccak = ["alloy-primitives/asm-keccak"]
keccak-cache-global = ["alloy-primitives/keccak-cache-global"]

[dependencies]
# The corpus reader, the flat value cache, and the eviction policy are taken from the production
# crate rather than reimplemented: the miss set this study holds fixed across tree backends is only
# meaningful if it is byte-identical to the one the measured MPT arms were built from.
partial-stateless = { path = "../partial-stateless" }
# The coverage binary re-executes each recorded block to see which code chunks actually run. It
# admits the payload through the same production path the validator uses rather than decoding blocks
# itself, so a block this study executes is the block the validator would have executed.
partial-stateless-validator = { path = "../partial-stateless-validator" }

reth-chainspec.workspace = true
reth-consensus.workspace = true
reth-ethereum-consensus.workspace = true
reth-ethereum-primitives.workspace = true
reth-evm = { workspace = true, features = ["std"] }
reth-evm-ethereum = { workspace = true, features = ["std"] }
reth-primitives-traits = { workspace = true, features = ["std", "secp256k1", "rayon"] }
revm = { workspace = true, features = ["std"] }
alloy-consensus.workspace = true
alloy-rlp.workspace = true
alloy-rpc-types-engine = { workspace = true, features = ["serde"] }

alloy-primitives.workspace = true
blake3.workspace = true
eyre.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[[bin]]
name = "ps-tree-study"
path = "src/bin/ps_tree_study.rs"

[[bin]]
name = "ps-code-coverage"
path = "src/bin/ps_code_coverage.rs"
